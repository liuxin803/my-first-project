<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="我的第一个独立项目首页">
  <title>我的第一个独立项目</title>
  <style>
    :root {
      --ink: #18232d;
      --muted: #65727c;
      --paper: #f7f5ef;
      --cream: #fffdf8;
      --blue: #226b72;
      --orange: #e77d52;
      --line: #d9ddd7;
      --shadow: 0 24px 70px rgba(24, 35, 45, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; }

    .page {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 92% 8%, rgba(231, 125, 82, 0.18), transparent 28%),
        linear-gradient(135deg, #f7f5ef 0%, #edf3ee 100%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--cream);
      background: var(--blue);
      border-radius: 10px 10px 10px 2px;
      font-size: 17px;
    }

    nav { display: flex; gap: 24px; color: var(--muted); font-size: 14px; }
    nav a { text-decoration: none; }
    nav a:hover { color: var(--blue); }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      align-items: center;
      gap: 72px;
      max-width: 1180px;
      min-height: calc(100vh - 94px);
      margin: 0 auto;
      padding: 50px 32px 90px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--orange); }

    h1 {
      max-width: 650px;
      margin: 0;
      font-family: Georgia, "Noto Serif CJK SC", serif;
      font-size: clamp(44px, 7vw, 82px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: 0.02em;
    }

    .intro {
      max-width: 540px;
      margin: 28px 0 34px;
      color: var(--muted);
      font-size: 18px;
    }

    .actions { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }

    .button {
      border: 0;
      padding: 14px 22px;
      color: var(--cream);
      background: var(--blue);
      border-radius: 6px;
      box-shadow: 0 8px 18px rgba(34, 107, 114, 0.22);
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      transition: transform 160ms ease, background 160ms ease;
    }

    .button:hover { background: #185960; transform: translateY(-2px); }
    .text-link { color: var(--ink); font-size: 15px; text-underline-offset: 5px; }

    .note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .showcase { position: relative; }

    .window {
      position: relative;
      padding: 20px;
      background: rgba(255, 253, 248, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transform: rotate(2deg);
    }

    .window-bar { display: flex; gap: 6px; margin-bottom: 22px; }
    .window-bar span { width: 8px; height: 8px; border-radius: 50%; background: #d5d9d1; }
    .window-bar span:first-child { background: var(--orange); }

    .preview {
      min-height: 340px;
      padding: 26px;
      color: var(--cream);
      background: var(--blue);
      border-radius: 10px;
      overflow: hidden;
    }

    .preview small { color: #b8d5d1; letter-spacing: 0.12em; }
    .preview h2 { max-width: 280px; margin: 46px 0 20px; font-family: Georgia, serif; font-size: 38px; font-weight: 400; line-height: 1.15; }
    .preview p { max-width: 260px; color: #d1e3df; font-size: 14px; }

    .stamp {
      position: absolute;
      right: -28px;
      bottom: -28px;
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      padding: 18px;
      color: var(--ink);
      background: var(--orange);
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      transform: rotate(-12deg);
    }

    @media (max-width: 760px) {
      header { padding: 22px 20px; }
      nav { display: none; }
      main { display: block; min-height: auto; padding: 58px 20px 80px; }
      .intro { font-size: 16px; }
      .showcase { max-width: 500px; margin: 72px auto 0; }
      .preview { min-height: 290px; }
      .stamp { right: -10px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="./" aria-label="回到首页">
        <span class="brand-mark">一</span>
        <span>我的第一个项目</span>
      </a>
      <nav aria-label="主要导航">
        <a href="#关于">关于项目</a>
        <a href="#开始">开始探索</a>
      </nav>
    </header>

    <main>
      <section id="关于">
        <p class="eyebrow">PROJECT 001</p>
        <h1>从一个想法，开始做点什么。</h1>
        <p class="intro">这是我的第一个独立项目。这里会记录想法、实验和一点点持续发生的变化。</p>
        <div class="actions" id="开始">
          <button class="button" type="button" id="startButton">开始探索</button>
          <a class="text-link" href="README.md">阅读项目说明 ↗</a>
        </div>
        <p class="note" id="status" aria-live="polite">一页简单的首页，先让项目真正开始。</p>
      </section>

      <section class="showcase" aria-label="项目预览">
        <div class="window">
          <div class="window-bar" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="preview">
            <small>NOW BUILDING</small>
            <h2>把好奇心，变成一个可以打开的页面。</h2>
            <p>小步尝试，及时记录，让每一次修改都留下痕迹。</p>
          </div>
        </div>
        <div class="stamp">持续<br>更新中</div>
      </section>
    </main>
  </div>

  <script>
    const startButton = document.querySelector('#startButton');
    const status = document.querySelector('#status');

    startButton.addEventListener('click', () => {
      status.textContent = '很好，第一步已经完成。接下来可以把你的想法写进来。';
      startButton.textContent = '继续前进';
    });
  </script>
</body>
</html>
