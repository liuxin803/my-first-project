<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="我的中文个人导航网站，收藏常用工具、学习资源和生活网站。">
  <title>小舟导航 · 个人网址导航</title>
  <style>
    :root {
      --bg: #f4f6f2;
      --surface: rgba(255, 255, 255, 0.8);
      --surface-strong: #ffffff;
      --text: #18252d;
      --muted: #68747a;
      --line: #dfe5e0;
      --brand: #196b68;
      --brand-soft: #dcefeb;
      --accent: #e47d52;
      --shadow: 0 18px 50px rgba(25, 56, 59, 0.09);
    }

    [data-theme="dark"] {
      --bg: #182427;
      --surface: rgba(34, 49, 52, 0.88);
      --surface-strong: #26383a;
      --text: #edf4ef;
      --muted: #a9bab6;
      --line: #3b5050;
      --brand: #7bd0c1;
      --brand-soft: #294b4c;
      --accent: #f0a078;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      transition: color 180ms ease, background 180ms ease;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    .site {
      min-height: 100vh;
      background:
        radial-gradient(circle at 90% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 25rem),
        linear-gradient(140deg, var(--bg), color-mix(in srgb, var(--bg) 78%, var(--brand-soft)));
    }
    .wrap { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
    }
    .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 800; letter-spacing: 0.04em; }
    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: #fff;
      background: var(--brand);
      border-radius: 11px 11px 11px 3px;
      font-family: Georgia, serif;
      font-size: 20px;
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      padding: 9px 13px;
      color: var(--text);
      background: var(--surface);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .theme-toggle:hover { border-color: var(--brand); }

    .hero { padding: 76px 0 58px; text-align: center; }
    .eyebrow { margin: 0 0 14px; color: var(--brand); font-size: 13px; font-weight: 800; letter-spacing: 0.16em; }
    h1 { margin: 0; font-family: Georgia, "Noto Serif CJK SC", serif; font-size: clamp(42px, 7vw, 76px); font-weight: 500; line-height: 1.08; }
    .hero p { max-width: 520px; margin: 18px auto 28px; color: var(--muted); font-size: 16px; }

    .search {
      display: flex;
      align-items: center;
      max-width: 680px;
      margin: 0 auto;
      padding: 7px 8px 7px 18px;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .search-icon { width: 20px; color: var(--muted); font-size: 19px; }
    .search input { min-width: 0; flex: 1; border: 0; outline: 0; padding: 10px; color: var(--text); background: transparent; }
    .search input::placeholder { color: var(--muted); }
    .search button { border: 0; padding: 10px 19px; color: #fff; background: var(--brand); border-radius: 8px; cursor: pointer; font-weight: 700; }
    .search button:hover { filter: brightness(0.92); }
    .search-hint { min-height: 24px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 22px; }
    .toolbar h2 { margin: 0; font-size: 18px; }
    .count { color: var(--muted); font-size: 13px; }
    .categories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; padding-bottom: 70px; }
    .category { min-width: 0; }
    .category-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 16px; }
    .category-heading span { display: grid; width: 29px; height: 29px; place-items: center; color: var(--brand); background: var(--brand-soft); border-radius: 8px; }
    .links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .link-card {
      display: block;
      min-width: 0;
      padding: 14px;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: 0 5px 18px rgba(25, 56, 59, 0.03);
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }
    .link-card:hover { border-color: var(--brand); box-shadow: var(--shadow); transform: translateY(-2px); }
    .link-card strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .link-card small { display: block; overflow: hidden; margin-top: 3px; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .empty { grid-column: 1 / -1; padding: 42px 20px; color: var(--muted); text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
    footer { padding: 24px 0 36px; color: var(--muted); border-top: 1px solid var(--line); font-size: 13px; text-align: center; }

    @media (max-width: 700px) {
      .wrap { width: min(100% - 32px, 560px); }
      header { padding: 19px 0; }
      .brand span:last-child { font-size: 14px; }
      .theme-toggle span { display: none; }
      .hero { padding: 58px 0 42px; }
      .hero p { font-size: 15px; }
      .search { padding-left: 12px; }
      .search button { padding: 10px 14px; }
      .categories { grid-template-columns: 1fr; gap: 25px; }
      .links { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 380px) {
      .search button { font-size: 0; }
      .search button::after { content: "↗"; font-size: 17px; }
      .link-card { padding: 12px 10px; }
    }
  </style>
</head>
<body>
  <div class="site">
    <div class="wrap">
      <header>
        <a class="brand" href="./" aria-label="回到小舟导航首页">
          <span class="brand-mark">舟</span>
          <span>小舟导航</span>
        </a>
        <div class="header-actions">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式">
            <span id="themeIcon">◐</span><span id="themeText">深色模式</span>
          </button>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <p class="eyebrow">PERSONAL NAVIGATION</p>
          <h1 id="pageTitle">今天，去哪里？</h1>
          <p>把常用的网站放在手边，少一点寻找，多一点专注。</p>
          <form class="search" id="searchForm" role="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索网站名称或描述..." autocomplete="off">
            <button type="submit">搜索</button>
          </form>
          <p class="search-hint" id="searchHint" aria-live="polite">输入关键词，快速找到你的常用网站</p>
        </section>

        <section aria-labelledby="linksTitle">
          <div class="toolbar">
            <h2 id="linksTitle">常用网站</h2>
            <span class="count" id="linkCount"></span>
          </div>
          <div class="categories" id="categories"></div>
        </section>
      </main>

      <footer>愿每一次点击，都通向值得探索的地方。</footer>
    </div>
  </div>

  <script>
    const links = [
      { category: '开发工具', icon: '</>', items: [
        ['GitHub', '代码托管与协作', 'https://github.com'],
        ['Stack Overflow', '开发问答社区', 'https://stackoverflow.com'],
        ['MDN Web Docs', 'Web 技术文档', 'https://developer.mozilla.org/zh-CN'],
        ['Can I Use', '浏览器兼容性查询', 'https://caniuse.com']
      ] },
      { category: '设计资源', icon: '✦', items: [
        ['Figma', '在线界面设计工具', 'https://www.figma.com'],
        ['Unsplash', '免费高质量图片', 'https://unsplash.com'],
        ['Google Fonts', '开源字体资源', 'https://fonts.google.com'],
        ['Coolors', '配色方案生成器', 'https://coolors.co']
      ] },
      { category: '学习成长', icon: '↗', items: [
        ['少数派', '高效生活与数字工具', 'https://sspai.com'],
        ['Coursera', '在线课程学习平台', 'https://www.coursera.org'],
        ['得到', '知识服务平台', 'https://www.dedao.cn'],
        ['Wikipedia', '自由的百科全书', 'https://zh.wikipedia.org']
      ] },
      { category: '娱乐生活', icon: '○', items: [
        ['哔哩哔哩', '视频与兴趣社区', 'https://www.bilibili.com'],
        ['豆瓣', '发现书影音生活', 'https://www.douban.com'],
        ['网易云音乐', '发现好音乐', 'https://music.163.com'],
        ['知乎', '有问题，就会有答案', 'https://www.zhihu.com']
      ] }
    ];

    const categories = document.querySelector('#categories');
    const searchInput = document.querySelector('#searchInput');
    const searchForm = document.querySelector('#searchForm');
    const searchHint = document.querySelector('#searchHint');
    const linkCount = document.querySelector('#linkCount');
    const themeToggle = document.querySelector('#themeToggle');
    const themeText = document.querySelector('#themeText');
    const themeIcon = document.querySelector('#themeIcon');

    function renderLinks(keyword = '') {
      const query = keyword.trim().toLowerCase();
      let visibleCount = 0;
      categories.innerHTML = links.map((group) => {
        const filteredItems = group.items.filter(([name, description]) =>
          `${name} ${description} ${group.category}`.toLowerCase().includes(query)
        );
        visibleCount += filteredItems.length;
        if (!filteredItems.length) return '';
        return `<section class="category"><h3 class="category-heading"><span aria-hidden="true">${group.icon}</span>${group.category}</h3><div class="links">${filteredItems.map(([name, description, url]) => `<a class="link-card" href="${url}" target="_blank" rel="noopener noreferrer"><strong>${name}</strong><small>${description}</small></a>`).join('')}</div></section>`;
      }).join('');
      linkCount.textContent = `${visibleCount} 个网站`;
      if (!visibleCount) {
        categories.innerHTML = '<p class="empty">没有找到匹配的网站，换个关键词试试吧。</p>';
        searchHint.textContent = `没有找到“${keyword}”相关的网站`;
      } else {
        searchHint.textContent = query ? `找到 ${visibleCount} 个相关网站` : '输入关键词，快速找到你的常用网站';
      }
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const isDark = theme === 'dark';
      themeText.textContent = isDark ? '浅色模式' : '深色模式';
      themeIcon.textContent = isDark ? '☼' : '◐';
      themeToggle.setAttribute('aria-label', isDark ? '切换浅色模式' : '切换深色模式');
      localStorage.setItem('nav-theme', theme);
    }

    renderLinks();
    setTheme(localStorage.getItem('nav-theme') || 'light');
    searchInput.addEventListener('input', (event) => renderLinks(event.target.value));
    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      renderLinks(searchInput.value);
      searchInput.focus();
    });
    themeToggle.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
